services:
  - type: web
    name: serverdesk-webhook
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DEV_MODE
        value: "1"
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
